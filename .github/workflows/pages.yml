# Build the benchmark report site and publish it to GitHub Pages.
# The site is generated from results/<host>/ by harness/7-report-and-feedback;
# build-site.sh refuses output that carries access/infrastructure details.
name: Publish site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'results/**'
      - 'harness/7-report-and-feedback/**'
      - 'harness/6-accept-and-publish/schemas/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: harness/7-report-and-feedback/code/site/astro/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build site
        env:
          SITE_BASE: ${{ steps.pages.outputs.base_path }}/
          ASTRO_TELEMETRY_DISABLED: '1'
        run: make build-site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
