global:
  scrape_interval: 1s
  scrape_timeout: 900ms
scrape_configs:
  - job_name: node
    static_configs: [{targets: [host.docker.internal:9100]}]
  - job_name: gpu
    static_configs: [{targets: [dcgm-exporter:9400]}]
  - job_name: containers
    static_configs: [{targets: [cadvisor:8080]}]
  # Add one job per inference replica. Do not aggregate resettable counters
  # through a load balancer.
  # - job_name: vllm_replica_a
  #   static_configs: [{targets: [host.docker.internal:9401]}]
