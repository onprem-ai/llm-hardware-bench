schema_version: 1
publication_id: qwen3.8-flash-next
study_id: xe7740
host: xe7740-04

model:
  repository: RadixArk/Qwen3.8-Flash-Next-NVFP4
  revision: 7b719225242aacd3dbd3f9407468c2ee9a9d2594
  quantization: NVFP4
  host_path: /home/demouser/models/RadixArk--Qwen3.8-Flash-Next-NVFP4--model
  container_mount: /model  # read-only

container:
  # The measured runs did NOT use a registry image directly. The published
  # image lacks SM120 in the TRT-LLM QSA decode path; the operator applied a
  # source edit widening the guard from SM100-only to SM100-or-SM120 and
  # committed the result locally. Pulling the base tag alone will not reproduce
  # these measurements.
  image: local/qwen38-flash-next-sm120:operator-patched
  base_image: lmsysorg/sglang:qwen38flashnext
  base_oci_index_digest: sha256:12d3392bdc8be8d35e9a95f191df6aef99c5114bdbefd41bfdc7e760e6d25ec1
  sglang_base_commit: d91c3682b0b429e4c70df63cd57f819588ce29b0
  patch:
    target: TRT-LLM QSA decode path architecture guard
    change: SM100 only -> SM100 or SM120
    build_recipe: unrecorded
    # No Dockerfile or build script was found. The edit is described in
    # journal/2026-09-01-qwen38-flash-next-aggressive-tuning.md and the image
    # still exists on xe7740-04, so the change is re-derivable by inspection
    # but is not reproducible from this repository.

topology:
  replicas: 4
  tensor_parallel_per_replica: 2
  gpu_pairs: [[0, 1], [2, 3], [4, 5], [6, 7]]  # replica index * 2
  ports: [8101, 8102, 8103, 8104]              # 8101 + replica index
  replica_names: [qwen38-flash-a, qwen38-flash-b, qwen38-flash-c, qwen38-flash-d]
  load_balancer:
    image: haproxy:3.2-alpine
    container_name: qwen38-flash-lb
    frontend: 127.0.0.1:8000
    metrics: 8404
    balance: leastconn
    config: haproxy.cfg

# One server configuration per measured series. Names match the source_id
# values in the publication's normalized_data.selection.
profiles:
  decode-optimized:
    launch: decode/launch.sh
    workload: 8 input / 512 output tokens
    max_running_requests: 48
    max_prefill_tokens: 32768
    chunked_prefill_size: 4096
    max_mamba_cache_size: 240
    cuda_graph_max_bs_decode: 48
    speculative_decoding: NEXTN, 3 steps, eagle-topk 1, 4 draft tokens
    radix_cache: enabled
    global_active_sequence_ceiling: 192  # 4 replicas * 48
  prefill-optimized-uncached:
    launch: prefill/launch.sh
    workload: 4096 input / 8 output tokens
    max_running_requests: 24
    max_prefill_tokens: 65536
    chunked_prefill_size: 16384
    max_mamba_cache_size: 120
    cuda_graph_max_bs_decode: 24
    speculative_decoding: disabled
    radix_cache: disabled  # --disable-radix-cache
    global_active_sequence_ceiling: 96  # 4 replicas * 24

# Shared by both profiles.
common_flags:
  tensor_parallel: 2
  mem_fraction_static: 0.95
  context_length: 262144
  quantization: modelopt_fp4
  fp4_gemm_backend: flashinfer_cutlass
  page_size: 64
  ple_offload_embedding: disabled  # PLE table stays GPU-resident
  linear_attn_prefill_backend: triton
  linear_attn_decode_backend: flashinfer
  mamba_ssm_dtype: bfloat16
  mamba_radix_cache_strategy: extra_buffer
  mamba_track_interval: 64

verification:
  # max-running-requests is a request, not a guarantee. SGLang uses five Mamba
  # state slots per active request for this model plus NEXTN configuration, so
  # max-mamba-cache-size silently caps admission to floor(cache / 5). An early
  # campaign requested 96 and was capped to 3, logging:
  #   "max_running_requests is capped to 3 by the mamba state cache"
  # which produced a spurious ~240 output tok/s plateau. Every launch must be
  # checked against the runtime log, never the requested value.
  required_check: startup log reports max_running_requests equal to the profile value
  on_mismatch: record in manual-review.txt and do not treat the runs as valid

provenance:
  recovered_at: 2026-09-02
  recovered_from:
    - /home/demouser/qwen38-grid-completion.sh  # generated the launch scripts and ran docker
    - .../formal-completion-v2/deployments/{decode,prefill}/{a,b,c,d}/launch.sh
    - .../preflight/haproxy.cfg
    - journal/2026-09-01-qwen38-flash-next-aggressive-tuning.md  # image identity and patch
  campaign_root: /home/demouser/llm-benchmark-results/xe7740-04/qwen3.8-flash-next-nvfp4/7b719225242a/qualification-4xtp2/20260831-qwen38-flash-next-qualification
  per_run_launch_command: absent
  classification: qualification evidence, not an approved formal campaign
