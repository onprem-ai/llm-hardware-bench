global
  log stdout format raw local0
  maxconn 10000
defaults
  log global
  mode http
  timeout connect 5s
  timeout client 1800s
  timeout server 1800s
frontend qwen_frontend
  bind *:8000
  default_backend qwen_backends
frontend metrics
  bind *:8404
  http-request use-service prometheus-exporter if { path /metrics }
  no log
backend qwen_backends
  balance leastconn
  server qwen_a 127.0.0.1:8101 check
  server qwen_b 127.0.0.1:8102 check
  server qwen_c 127.0.0.1:8103 check
  server qwen_d 127.0.0.1:8104 check
