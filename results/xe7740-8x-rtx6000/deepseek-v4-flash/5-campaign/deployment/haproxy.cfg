global
  log stdout format raw local0
  maxconn 20000

defaults
  log global
  mode http
  option httplog
  option dontlognull
  timeout connect 10s
  timeout client 1800s
  timeout server 1800s

frontend deepseek_api
  bind 127.0.0.1:8084
  default_backend deepseek_replicas

backend deepseek_replicas
  balance leastconn
  option tcp-check
  server ds4_a 127.0.0.1:8080 check inter 2s fall 3 rise 2
  server ds4_b 127.0.0.1:8081 check inter 2s fall 3 rise 2
  server ds4_c 127.0.0.1:8082 check inter 2s fall 3 rise 2
  server ds4_d 127.0.0.1:8083 check inter 2s fall 3 rise 2

frontend prometheus
  bind 127.0.0.1:8405
  http-request use-service prometheus-exporter if { path /metrics }
  no log
