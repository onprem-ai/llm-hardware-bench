# Round-robin front for four TP2 replicas, so a load applied at the front is spread across all
# four. Without this, every request hits one replica and the other three report only their
# weight-load footprint -- which is not the topology's RAM cost.
global
    log stdout format raw local0
defaults
    mode http
    timeout connect 10s
    timeout client  600s
    timeout server  600s
frontend glm_front
    bind 127.0.0.1:8100
    default_backend qwen_tp2
backend qwen_tp2
    balance roundrobin
    option httpchk GET /health
    server r0 127.0.0.1:30000 check port 30000
    server r1 127.0.0.1:30001 check port 30001
    server r2 127.0.0.1:30002 check port 30002
    server r3 127.0.0.1:30003 check port 30003
