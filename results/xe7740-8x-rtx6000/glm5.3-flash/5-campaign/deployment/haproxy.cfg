global
    maxconn 4096
    log stdout format raw local0

defaults
    mode http
    log global
    option httplog
    timeout connect 10s
    timeout client 30m
    timeout server 30m

frontend llm_api
    bind *:8082
    default_backend glm53_replicas

backend glm53_replicas
    balance leastconn
    option httpchk GET /health
    http-check expect status 200
    server replica_a 127.0.0.1:8080 check inter 2s fall 3 rise 2
    server replica_b 127.0.0.1:8081 check inter 2s fall 3 rise 2

# Metrics-only proxies let bridge-network VictoriaMetrics scrape host-network vLLM replicas.
frontend vllm_a_metrics
    bind *:9400
    default_backend vllm_a_metrics_backend
backend vllm_a_metrics_backend
    server replica_a_metrics 127.0.0.1:8080

frontend vllm_b_metrics
    bind *:9401
    default_backend vllm_b_metrics_backend
backend vllm_b_metrics_backend
    server replica_b_metrics 127.0.0.1:8081
