global
  log stdout format raw local0
defaults
  mode http
  log global
  option httplog
  timeout connect 5s
  timeout client 1900s
  timeout server 1900s
frontend measured
  bind 127.0.0.1:8084
  default_backend engine
backend engine
  server engine-0 127.0.0.1:8080 check inter 3s
frontend stats
  bind 127.0.0.1:8404
  stats enable
  stats uri /stats
  http-request use-service prometheus-exporter if { path /metrics }
